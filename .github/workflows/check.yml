name: CPU framework checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research-boundaries:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONPYCACHEPREFIX: /tmp/tfm-pilot-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.7.2 pyarrow==26.0.0 psutil==7.2.2 matplotlib==3.11.2
      - run: python -m unittest discover -s tests -v
